name: Test and release
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:coverage
      - run: docker build -t balance-test .
      - name: Verify container startup
        run: |
          docker run -d --name balance -p 127.0.0.1:3000:3000 balance-test
          for attempt in {1..20}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' balance)" != true ]]; then
              break
            fi
            if curl --silent --show-error --fail --max-time 2 http://localhost:3000/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker inspect --format '{{json .State}}' balance
          docker logs balance
          exit 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
